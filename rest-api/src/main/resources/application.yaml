rfbpa:
  environment: "$RFBPA_ENVIRONMENT:development"

  auth:
    jwkEndpoint: "$RFBPA_AUTH_JWKS_ENDPOINT:http://localhost:8383/realms/rfbpa/protocol/openid-connect/certs"
    jwtIssuer: "$RFBPA_JWT_ISSUER:http://localhost:8383/realms/rfbpa"
    jwtRealm: "$RFBPA_JWT_REALM:rfbpa"

  mithf:
    mithfHost: "$RFBPA_MITHF_HOST:https://mithf.handicapformidlingen.dk"
    temponizerHost: "$RFBPA_TEMPONIZER_HOST:https://handicapformidlingen.temponizer.dk"
    username: $RFBPA_MITHF_USER
    password: $RFBPA_MITHF_PASSWORD

ktor:
  development: true
  deployment:
    watch:
      - classes
      - resources
    port: 8080
  application:
    modules:
      - dk.rohdef.rfbpa.web.MainKt.main
